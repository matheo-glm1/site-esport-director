<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Esports Director</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="site.html" class="brand" style="text-decoration:none;color:inherit;">
      <span class="dot"></span> <span id="hdrGameName">Esports Director</span>
    </a>
    <nav class="site-nav">
      <a href="site.html#features">Fonctionnalités</a>
      <a href="site.html#screenshots">Images</a>
      <a href="site.html#changelog">Notes de patch</a>
      <a href="site.html#download">Télécharger</a>
      <a href="faq.html">FAQ</a>
    </nav>
    <a href="site.html#download" class="btn btn-gold">Télécharger</a>
  </div>
</header>

<div class="page-hero">
  <div class="container">
    <h1>Contact</h1>
    <p>Un bug, un plantage, une suggestion sur la bêta ?</p>
  </div>
</div>

<div class="page-content">
  <div class="container">
    <div class="contact-card" id="contactCard">
      <div class="mail-icon">✉️</div>
      <p id="contactText" style="color:var(--text-secondary);font-size:14px;margin-bottom:20px;">Chargement…</p>
      <a href="#" id="mailBtn" class="btn btn-gold btn-lg">Envoyer un email</a>
    </div>
  </div>
</div>

<footer class="site-footer">
  <div class="container" style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px;width:100%;">
    <span>© <span id="footerYear"></span> <span id="footerGameName">Esports Director</span></span>
    <div style="display:flex;gap:16px;flex-wrap:wrap;">
      <a href="faq.html">FAQ</a>
      <a href="contact.html">Contact</a>
      <a href="mentions-legales.html">Mentions légales</a>
      <a href="creator.html">Espace créateur</a>
    </div>
  </div>
</footer>

<script src="config.js"></script>
<script>
(function(){
  "use strict";
  const cfg = window.SITE_CONFIG;
  if(!cfg){
    document.getElementById('contactText').textContent =
      'Impossible de charger le contenu (config.js absent).';
    return;
  }
  document.title = `Contact — ${cfg.gameName || 'Jeu'}`;
  document.getElementById('hdrGameName').textContent = cfg.gameName;
  document.getElementById('footerGameName').textContent = cfg.gameName;
  document.getElementById('footerYear').textContent = new Date().getFullYear();

  const mailBtn = document.getElementById('mailBtn');
  const text = document.getElementById('contactText');
  if(cfg.contactEmail){
    mailBtn.href = `mailto:${cfg.contactEmail}?subject=${encodeURIComponent((cfg.gameName||'Jeu') + ' — Contact')}`;
    text.textContent = `Écrivez-nous directement à ${cfg.contactEmail}, on vous répond au plus vite.`;
  } else {
    mailBtn.href = '#';
    mailBtn.textContent = 'Adresse à configurer';
    mailBtn.setAttribute('disabled','');
    text.textContent = "L'adresse de contact n'est pas encore configurée (espace créateur > Contact & mentions légales).";
  }
})();
</script>
</body>
</html>
